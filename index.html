:root{
  --bg:#FBF6F2; --card:#FFFFFF; --ink:#2B2326; --muted:#6B5E66; --line:#EFE3DD;
  --plum:#7A4560; --plum-d:#5E3149; --blush:#F6E6EC; --honey:#D9A441; --honey-l:#FBF1DD;
  --sage:#5E8A6E; --sage-l:#E7F1EA;
  --P:#7A4560; --V:#5E8A6E; --F:#D9A441; --C:#C9826B;
  --r:16px; --shadow:0 2px 14px -6px rgba(122,69,96,.22);
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --hand:'Caveat',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 24px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
.brand{font-family:var(--serif);font-weight:600;color:var(--plum);font-size:19px;line-height:1.1}
.brand small{display:block;font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--honey);margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
.pill.on{background:var(--plum);border-color:var(--plum);color:#fff}
/* bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bn .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bn button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
nav.bn button svg{width:22px;height:22px}
nav.bn button.on{color:var(--plum)}
nav.bn button.on svg{stroke:var(--plum)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-family:var(--serif);font-weight:600;color:var(--plum);font-size:20px;margin:0 0 4px;line-height:1.2}
.card h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:14px 0 8px;color:var(--plum-d)}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.kicker{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--honey)}
.hand{font-family:var(--hand);font-size:22px;color:var(--plum);line-height:1.1}
.quote{background:var(--plum);color:#fff;border:0}
.quote .q{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.35}
.quote .kicker{color:#F3C9D9;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14.5px;background:var(--plum);color:#fff}
.btn.sec{background:var(--card);color:var(--plum);border:1.5px solid var(--plum)}
.btn.honey{background:var(--honey);color:#3a2a10}
.btn.ghost{background:transparent;color:var(--plum);padding:8px 10px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.chip.soft{background:var(--blush);border-color:var(--blush);color:var(--plum-d)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--blush);color:var(--plum-d);margin:0 4px 4px 0}
.tag.honey{background:var(--honey-l);color:#7a5414}
.tag.sage{background:var(--sage-l);color:#335c43}
.tag.warn{background:#FCE8E0;color:#8a3b1e}
.note{background:var(--honey-l);border-left:4px solid var(--honey);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.note.sage{background:var(--sage-l);border-color:var(--sage)}
.note.blush{background:var(--blush);border-color:var(--plum)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
/* meal rows */
.meal{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:#FDF9F7;border:1px solid var(--line);margin-bottom:8px}
.meal .lbl{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--honey)}
.meal .nm{font-weight:600;font-size:14.5px;line-height:1.25}
.meal .grow{flex:1;min-width:0}
.meal.lo{background:var(--sage-l);border-color:#d4e6da}
.meal.empty .nm{color:var(--muted);font-weight:500}
.checkin{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.checkin button{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11.5px;padding:4px 9px;font-weight:600;color:var(--muted)}
.checkin button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
/* plate dots/ring */
.dots{display:inline-flex;gap:3px;flex-shrink:0}
.dots i{width:9px;height:9px;border-radius:50%;background:#EADFE3;display:block}
.dots i.P.on{background:var(--P)}.dots i.V.on{background:var(--V)}.dots i.F.on{background:var(--F)}.dots i.C.on{background:var(--C)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.tool b{font-size:14px}
.tool span{font-size:12px;color:var(--muted);line-height:1.3}
.tool .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--blush);margin-bottom:4px}
.tool .ic svg{width:18px;height:18px;stroke:var(--plum)}
.tool.hero{background:var(--plum);color:#fff;border-color:var(--plum)}
.tool.hero span{color:#F3D6E2}.tool.hero .ic{background:rgba(255,255,255,.16)}.tool.hero .ic svg{stroke:#fff}
/* toggle */
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.sw{position:relative;width:46px;height:27px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#E5D9DE;border-radius:99px;transition:.2s}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--plum)}
.sw input:checked+span::after{transform:translateX(19px)}
/* inputs */
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:15px}
.field:focus{outline:2px solid var(--blush);border-color:var(--plum)}
textarea.field{min-height:84px;resize:vertical}
/* recipes */
.rlist{display:grid;gap:8px}
.rcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.rcard .nm{font-weight:600;font-size:14.5px;line-height:1.25}
.rcard .meta{font-size:12px;color:var(--muted)}
.rcard .grow{flex:1;min-width:0}
.thumb{width:48px;height:48px;flex-shrink:0}
.fav{background:none;border:0;font-size:20px;color:var(--plum);padding:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(43,35,38,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#DCCDD3;margin:4px auto 10px}
.sheet .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet .hd h2{font-family:var(--serif);font-weight:600;color:var(--plum);font-size:21px;margin:0;line-height:1.2}
.x{border:0;background:var(--card);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;flex-shrink:0;border:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.ing li,.steps li{margin-bottom:5px}
.ing{padding-left:18px;margin:6px 0}
.steps{padding-left:20px;margin:6px 0}
/* plate ring */
.plate{display:flex;gap:16px;align-items:center;margin:8px 0 12px}
.plate .lines{font-size:13px;line-height:1.6}
.plate .lines b{display:inline-block;width:62px}
/* grocery */
.gsec{margin-bottom:6px}
.gsec h3{font-family:var(--sans)!important;font-size:11px!important;letter-spacing:1.8px;text-transform:uppercase;color:var(--honey)!important;margin:14px 0 4px!important}
.gi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.gi input[type=checkbox]{width:20px;height:20px;accent-color:var(--plum);flex-shrink:0}
.gi .t{flex:1;font-size:14.5px}
.gi .q{font-weight:700;color:var(--plum);font-size:13px;white-space:nowrap}
.gi.done .t{text-decoration:line-through;color:var(--muted)}
.gi .have{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11px;padding:4px 7px;color:var(--muted)}
/* plan */
.day{margin-bottom:14px}
.day h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-family:var(--serif);font-size:16px;color:var(--plum-d)}
.day h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500}
.day.today h3{color:var(--plum)}
.badge{font-size:10.5px;font-weight:700;color:#335c43;background:var(--sage-l);border-radius:6px;padding:2px 6px;margin-left:4px;white-space:nowrap}
/* onboarding */
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px;margin-bottom:9px;font-weight:600;font-size:15px}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt.on{border-color:var(--plum);background:var(--blush)}
.prog{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.prog i{display:block;height:100%;background:var(--plum);border-radius:9px;transition:width .2s}
/* insights */
.ins{border-left:4px solid var(--sage);background:var(--sage-l);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.bar{height:10px;border-radius:9px;background:#EADFE3;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hands{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:520px){.hands{grid-template-columns:1fr 1fr}}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.hcard svg{width:44px;height:44px;flex-shrink:0}
.hcard b{display:block;font-size:14px}
.hcard span{font-size:12.5px;color:var(--muted);line-height:1.35}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .chip{white-space:nowrap}
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  .wrap,nav.bn,.scrim,.toast{display:none!important}
  #print{display:block!important;font-family:var(--sans);color:#000;padding:10mm}
  #print h1{font-family:var(--serif);color:var(--plum);font-size:22px;margin:0 0 4px}
  #print h2{font-size:14px;margin:14px 0 4px;color:var(--plum)}
  #print table{border-collapse:collapse;width:100%;font-size:12px}
  #print td,#print th{border:1px solid #ccc;padding:4px 6px;text-align:left}
}
@media (min-width:560px){ .tools{grid-template-columns:repeat(3,1fr)} }

function showQ(q, u) {

  if (u === 'g') return Math.round(q / 5) * 5 + ' g'; if (u === 'ml') return Math.round(q / 10) * 10 + ' ml';
  if (u === 'pc') return nice(q); if (u === 'can') return nice(q) + ' can'; if (u === 'tbsp') return nice(q) + ' tbsp'; if (u === 'slice') return nice(q) + (q > 1 ? ' slices' : ' slice'); if (u === 'bunch') return nice(q) + ' bunch';

}

  const ex = S.settings.style === 'western' ? ['toast and coffee', 'pasta with chicken', 'cereal with milk'] : ['paratha and chai', 'daal chawal', 'biryani with raita', 'toast and coffee'];
  sheet('Build my plate', `<p class="lede">Type what's on your plate, any way you'd say it. The app shows what's covered and what one partner would make it steadier.</p>
  <input class="field" id="bp" value="${esc(pre)}" placeholder="e.g. aloo paratha, chai" oninput="document.getElementById('bpr').innerHTML=this.value.trim().length>1?analysisHtml(this.value):''">
  <div class="chips" style="margin:8px 0">${ex.map(x => `<button class="chip soft" onclick="document.getElementById('bp').value='${x}';document.getElementById('bpr').innerHTML=analysisHtml('${x}')">${x}</button>`).join('')}</div>
  <div id="bpr">${pre ? analysisHtml(pre) : ''}</div>
  <div class="legend" style="margin-top:8px"><span style="--c:var(--P)">Protein</span><span style="--c:var(--V)">Fiber/veg</span><span style="--c:var(--F)">Fat</span><span style="--c:var(--C)">Carb</span></div>`);
}
function openSwap() {
  const pop = DATA.swaps.filter(s => S.settings.style === 'western' ? s[1] === 'western' : S.settings.style === 'desi' ? s[1] === 'desi' : true).slice(0, 10);
  sheet('Swap finder', `<p class="lede">Name what you're craving. You'll get steadier ways to keep eating it, never a "don't".</p>
  <input class="field" id="sw" placeholder="e.g. biryani, karak chai, pizza" oninput="document.getElementById('swr').innerHTML=swapHtml(this.value)">
  <div class="chips" style="margin:8px 0">${pop.map(s => `<button class="chip soft" onclick="document.getElementById('sw').value='${s[0].replace(/'/g, "\\'")}';document.getElementById('swr').innerHTML=swapHtml('${s[0].replace(/'/g, "\\'")}')">${esc(s[0])}</button>`).join('')}</div>
  <div id="swr"></div><p class="small muted">${DATA.swaps.length} cravings covered. Anything else gets a plate check instead.</p>`);
}
function swapHtml(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return '';
  const words = q.split(/[\s\/,]+/).filter(w => w.length > 2);
  let best = null, score = 0;
  DATA.swaps.forEach(s => { const n = s[0].toLowerCase(); let sc = n === q ? 100 : n.includes(q) ? 50 : 0; words.forEach(w => { if (n.includes(w)) sc += 10; }); if (sc > score) { score = sc; best = s; } });
  if (!best) {
    // try food aliases to map to a swap
    const a = analyse(q);
    if (a.found.length) return `<div class="note">No ready-made swap for that yet, so here's a plate check instead.</div>` + analysisHtml(q);
    return `<p class="muted">Not in the list yet. Try a simpler word, or use Build my plate.</p>`;
  }
  return `<div class="card" style="margin-top:6px"><h3 style="margin-top:0">${esc(best[0])}</h3><ul style="padding-left:18px;margin:0">${best[2].map(o => `<li style="margin-bottom:6px">${esc(o)}</li>`).join('')}</ul></div>`;
}
let SOSK = null, SOSN = 0;
function openSOS() {
  sheet('I need something now', `<p class="lede">What's going on?</p><div class="grid2"><button class="opt" onclick="sos('sugar')">A sugar craving</button><button class="opt" onclick="sos('crash')">An energy crash</button><button class="opt" onclick="sos('hungry')">Just hungry</button><button class="opt" onclick="closeSheet();openTired()">Too tired to cook</button></div><div id="sosr"></div>`);
}
function sos(kind, more) {
  SOSK = kind; SOSN = more ? SOSN + 3 : 0; const st = S.settings;
  let l = DATA.craving[kind].filter(([t, p, al, meat, egg]) => !avoidHits(al).length && !(st.veg && meat) && !(!st.eggs && egg));
  if (!l.length) l = DATA.craving[kind];
  const pick = l.slice(SOSN % l.length).concat(l).slice(0, 3);
  const why = { sugar: 'Pairing the sweet thing with protein or fat softens the crash that usually follows. You still get the sweet.', crash: 'A protein-forward snack steadies energy faster than reaching for more sugar, which tends to crash again.', hungry: 'Real hunger deserves real food. A mini-meal with protein holds you longer than a snack.' }[kind];
  document.getElementById('sosr').innerHTML = `<h3>Try one of these</h3>${pick.map(([t, p]) => `<div class="meal"><div class="grow"><div class="nm">${esc(t)}</div></div><span class="tag">${p} protein</span></div>`).join('')}<div class="note">${why}<br><b>Cravings aren't a willpower problem.</b></div><button class="btn sec sm" onclick="sos('${kind}',true)">Show me 3 others</button>`;
}
function openTired() {
  const d = dayIdx(), cur = slotEntry(d, 'dinner');
  let l = allRecipes().filter(fits).filter(r => (r.meal === 'dinner' || r.meal === 'lunch' || r.meal === 'breakfast') && lowOk(r));
  const rank = r => (r.meal === 'breakfast' ? 0 : 2) + (r.nocook ? 1 : 0);
  l = shuffle(l).sort((a, b) => rank(b) - rank(a)).slice(0, 4);
  sheet('Too tired tonight', `<p class="lede">That's allowed, and it doesn't undo anything. Pick one of these 10-minute or no-cook dinners and it replaces tonight's plan${cur ? ` (<i>${esc(entryName(cur))}</i> moves to tomorrow if tomorrow's dinner is free)` : ''}.</p>
  ${l.map(r => `<button class="rcard" style="margin-bottom:8px" onclick="tiredPick('${r.id}')">${thumb(r)}<div class="grow"><div class="nm">${esc(r.name)}</div><div class="meta">${r.time} min${r.nocook ? ' · no cooking' : ''}</div></div>${dots(r.plate)}</button>`).join('')}
  <div class="note"><b>Assemble, don't cook:</b> roti + peanut butter + banana · yogurt + nuts + fruit · boiled eggs + toast + cucumber · chana chaat from a can.</div>`);
}
function tiredPick(id) {
  const d = dayIdx(); const cur = slotEntry(d, 'dinner');
  if (cur && cur.id && d < 6 && !S.plan.days[d + 1].dinner) S.plan.days[d + 1].dinner = { id: cur.id };
  if (cur && cur.extra && d < 6) { ['lunch', 'meal1'].forEach(s => { const nx = S.plan.days[d + 1][s]; if (nx && nx.lo) delete S.plan.days[d + 1][s]; }); }
  S.plan.days[d].dinner = { id }; save(); closeSheet(); render(); toast('Tonight is sorted. Rest well.');
}
function openFamily(name, d, slot) {
  if (name) {
    const f = DATA.family.find(x => x[0] === name);
    sheet(f[0], `<p class="lede">Same pot as everyone else. Here's how to build your plate from it.</p><ol style="padding-left:20px">${f[1].map(x => `<li style="margin-bottom:8px">${esc(x)}</li>`).join('')}</ol>${handMini()}<button class="btn sec block" style="margin-top:10px" onclick="openBuilder('${esc(f[0]).replace(/'/g, "\\'")}')">Check my plate</button>`);
    return;
  }
  const pickMode = d !== undefined;
  sheet(pickMode ? 'Family meal' : 'Family meal tonight', `<p class="lede">In most homes, one pot feeds everyone and you don't control the menu. You don't need a separate meal. Pick what's being cooked.</p>
  <div class="rlist">${DATA.family.map(f => `<button class="rcard" onclick="${pickMode ? `setEntry(${d},'${slot}',{family:'${f[0].replace(/'/g, "\\'")}'})` : `openFamily('${f[0].replace(/'/g, "\\'")}')`}"><div class="grow"><div class="nm">${esc(f[0])}</div><div class="meta">${esc(f[1][0])}</div></div></button>`).join('')}</div>`);
}
function handMini() { return `<div class="note sage"><b>Portions by hand:</b> protein = your palm · carbs = one cupped hand · veg = your fist or more · fat = your thumb.</div>`; }
function handSvg(kind) {
  const c = { palm: '#7A4560', fist: '#5E8A6E', cup: '#C9826B', thumb: '#D9A441' }[kind];
  const shapes = {
    palm: '<rect x="12" y="16" width="22" height="24" rx="8"/><rect x="13" y="5" width="4.5" height="14" rx="2.2"/><rect x="18.5" y="3" width="4.5" height="15" rx="2.2"/><rect x="24" y="4" width="4.5" height="14" rx="2.2"/><rect x="29.5" y="8" width="4" height="12" rx="2"/><rect x="5" y="22" width="11" height="5" rx="2.5" transform="rotate(-30 10 24)"/>',
    fist: '<rect x="10" y="12" width="26" height="24" rx="9"/><path d="M14 18h18M14 24h18M14 30h18" stroke="#fff" stroke-width="1.6"/>',
    cup: '<path d="M6 20c2 12 8 18 18 18s16-6 18-18z"/><ellipse cx="24" cy="20" rx="18" ry="5" fill="#fff" stroke="' + c + '" stroke-width="2"/>',
    thumb: '<rect x="18" y="8" width="11" height="30" rx="5.5"/><rect x="19.5" y="9.5" width="8" height="7" rx="3" fill="#fff" opacity=".7"/>'
  };
  return `<svg viewBox="0 0 48 48" fill="${c}">${shapes[kind]}</svg>`;
}
function openHands() {
  sheet('Portions, by hand', `<p class="lede">No scale, no counting. Your hand is always with you and it's sized to your body.</p>
  <div class="hands">
  <div class="hcard">${handSvg('palm')}<div><b>Protein: 1 palm</b><span>2 eggs · a palm-size piece of chicken or fish · 1 katori daal or chana · 1 cup dahi</span></div></div>
  <div class="hcard">${handSvg('fist')}<div><b>Veg: 1-2 fists</b><span>A plate of salad, a katori of sabzi. More is always fine.</span></div></div>
  <div class="hcard">${handSvg('cup')}<div><b>Carbs: 1 cupped hand</b><span>1 roti · ½ katori rice · 1 slice bread · 1 small potato</span></div></div>
  <div class="hcard">${handSvg('thumb')}<div><b>Fat: 1 thumb</b><span>1 tsp ghee or oil · a small handful of nuts · 1 tbsp peanut butter</span></div></div></div>
  <div class="note">These are starting points, not rules. Still hungry? Add more protein or veg first. Training hard, breastfeeding or just hungrier today? Add a second cupped hand of carbs.</div>`);
}

/* ---------- boot ---------- */
render();

</script>
